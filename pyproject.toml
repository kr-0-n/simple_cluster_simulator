[project]
name = "simple-network-simulator"
version = "0.2.0"
description = "Simulator for comparing network aware Kubernetes scheduling algorithms"
requires-python = ">=3.10"
dependencies = ["networkx", "pyyaml", "pydot", "matplotlib"]

[project.scripts]
simulator = "simulator.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["simulator*", "simmath*"]

[project.optional-dependencies]
mysql = ["mysql-connector-python"]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
extend-exclude = ["network_aware_k8s_scheduler"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E701", "E731", "B905"]
